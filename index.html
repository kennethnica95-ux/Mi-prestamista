<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json">
<title>Mi Prestamista</title>
<style>
body{font-family:Arial;margin:0;background:#f4f4f4;color:#111}header{background:#111;color:white;padding:18px;font-size:23px;font-weight:bold}
main{max-width:700px;margin:auto;padding:15px}.card{background:white;padding:18px;border-radius:15px;margin-bottom:15px}
label{display:block;font-weight:bold;margin:11px 0 5px}input,select,button{width:100%;padding:12px;border-radius:9px;border:1px solid #ccc;font-size:16px;box-sizing:border-box}
button{background:#111;color:white;font-weight:bold;margin-top:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:#eee;padding:12px;border-radius:9px}.box small{display:block;color:#666}
table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}.note{font-size:13px;color:#666}
</style></head><body>
<header>Mi Prestamista</header><main>
<div class="card"><h2>Nuevo préstamo</h2>
<label>Cliente</label><input id="cliente" placeholder="Nombre del cliente"><label>Moneda</label><select id="moneda"><option value="NIO">Córdobas (C$)</option><option value="USD">Dólares (US$)</option></select>
<div class="row"><div><label>Capital (C$)</label><input id="capital" type="number" min="0"></div>
<div><label>Interés por período (%)</label><input id="interes" type="number" value="4" min="0" step=".01"></div></div>
<div class="row"><div><label>Frecuencia</label><select id="frecuencia"><option value="q">Quincenal</option><option value="m">Mensual</option></select></div>
<div><label>Número de pagos</label><input id="pagos" type="number" value="10" min="1"></div></div>

<div id="qbox"><label>Días de pago quincenal</label>
<select id="patron">
<option value="15,30">15 y 30 ⭐</option><option value="2,17">2 y 17</option><option value="3,18">3 y 18</option>
<option value="4,19">4 y 19</option><option value="5,20">5 y 20</option><option value="6,21">6 y 21</option>
<option value="7,22">7 y 22</option><option value="8,23">8 y 23</option><option value="9,24">9 y 24</option>
<option value="10,25">10 y 25</option><option value="11,26">11 y 26</option><option value="12,27">12 y 27</option>
<option value="13,28">13 y 28</option><option value="14,29">14 y 29</option><option value="custom">Personalizado</option>
</select>
<div id="custom" class="row hidden"><div><label>Día 1</label><input id="d1" type="number" value="15" min="1" max="31"></div>
<div><label>Día 2</label><input id="d2" type="number" value="30" min="1" max="31"></div></div></div>

<div id="mbox" class="hidden"><label>Día de pago mensual</label><select id="md"></select></div>
<label>Fecha desde la que empieza el calendario</label><input id="inicio" type="date">
<button id="calc">Calcular préstamo</button></div>

<div id="res" class="card hidden"><h2>Resumen</h2><div id="clienteOut" class="note"></div>
<div class="grid"><div class="box"><small>Capital</small><b id="capitalOut"></b></div>
<div class="box"><small>Interés total</small><b id="interestOut"></b></div><div class="box"><small>Total</small><b id="totalOut"></b></div>
<div class="box"><small>Cada pago</small><b id="cuotaOut"></b></div></div><p id="tipo" class="note"></p>
<h3>Tabla para enviar al cliente</h3>
<div style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>Capital</th><th>Interés</th><th>Cuota</th><th>Saldo</th></tr></thead><tbody id="tbody"></tbody></table></div>
<p class="note">El saldo mostrado es el saldo pendiente después de cada pago.</p></div>
</main>
<script>
const $=x=>document.getElementById(x);
function money(n,currency){return new Intl.NumberFormat(currency==="USD"?"en-US":"es-NI",{style:"currency",currency:currency,maximumFractionDigits:2}).format(n)}
for(let i=1;i<=31;i++)$("md").insertAdjacentHTML("beforeend",`<option value="${i}" ${i==30?"selected":""}>${i}</option>`);
let now=new Date();$("inicio").value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
$("frecuencia").onchange=()=>{$("qbox").classList.toggle("hidden",$("frecuencia").value!="q");$("mbox").classList.toggle("hidden",$("frecuencia").value=="q")};
$("patron").onchange=()=>$("custom").classList.toggle("hidden",$("patron").value!="custom");
function last(y,m){return new Date(y,m+1,0).getDate()} function mk(y,m,d){return new Date(y,m,Math.min(d,last(y,m)))}
function fmt(d){return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear()}
function qdates(base,n,days){
 let y=base.getFullYear(),m=base.getMonth(),first=null,idx=0;
 for(let k=0;k<24&&!first;k++){for(let i=0;i<2;i++){let d=mk(y,m,days[i]);if(d>=base){first=d;idx=i;break}}if(!first){m++;if(m>11){m=0;y++}}}
 let a=[first]; for(let i=1;i<n;i++){idx=(idx+1)%2;if(idx==0){m++;if(m>11){m=0;y++}}a.push(mk(y,m,days[idx]));} return a;
}
function mdates(base,n,day){
 let y=base.getFullYear(),m=base.getMonth(),d=mk(y,m,day);if(d<base){m++;if(m>11){m=0;y++}d=mk(y,m,day)}
 let a=[d];for(let i=1;i<n;i++){m++;if(m>11){m=0;y++}a.push(mk(y,m,day))}return a;
}
$("calc").onclick=()=>{
 let P=+$("capital").value,r=+$("interes").value/100,n=+$("pagos").value;
 if(!(P>0&&n>0&&r>=0)){alert("Completá los datos correctamente.");return}
 let base=new Date($("inicio").value+"T00:00:00"),dates,label;
 if($("frecuencia").value=="q"){let ds=$("patron").value=="custom"?[+$("d1").value,+$("d2").value]:$("patron").value.split(",").map(Number);
 if(ds[0]<1||ds[0]>31||ds[1]<1||ds[1]>31||ds[0]==ds[1]){alert("Los días deben ser diferentes y estar entre 1 y 31.");return}
 ds.sort((a,b)=>a-b);dates=qdates(base,n,ds);label=`Quincenal: ${ds[0]} y ${ds[1]}`}else{let day=+$("md").value;dates=mdates(base,n,day);label=`Mensual: día ${day}`}
 let currency=$("moneda").value;
 let ip=P*r, capitalPart=P/n, cuota=capitalPart+ip,totalI=ip*n,total=P+totalI;
 $("clienteOut").textContent=$("cliente").value?"Cliente: "+$("cliente").value:"";
 $("capitalOut").textContent=money(P,currency);
 $("interestOut").textContent=money(totalI,currency);
 $("totalOut").textContent=money(total,currency);
 $("cuotaOut").textContent=money(cuota,currency);
 $("tipo").textContent=label+" · "+(currency==="USD"?"Dólares (US$)":"Córdobas (C$)");
 let saldo=P;
 $("tbody").innerHTML=dates.map((d,i)=>{
   saldo=Math.max(0,saldo-capitalPart);
   return `<tr><td>${fmt(d)}</td><td>${money(capitalPart,currency)}</td><td>${money(ip,currency)}</td><td>${money(cuota,currency)}</td><td>${money(saldo,currency)}</td></tr>`;
 }).join("");
 $("res").classList.remove("hidden");
};
</script></body></html>
