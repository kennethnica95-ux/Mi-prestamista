<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0d1117">
<title>Mi Prestamista</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#f4f6fa;font-family:Arial,sans-serif}
main{max-width:600px;margin:auto;padding:15px 14px 40px}h1{font-size:27px;margin:5px 0}.sub{color:#9ca5b4;margin-bottom:15px}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:13px}.nav button{padding:11px 5px;border:0;border-radius:12px;background:#202633;color:#dce2ed;font-weight:bold}.nav button.active{background:#a9c1ff;color:#10234c}
section{display:none}.show{display:block}.card{background:#171c25;border:1px solid #2d3543;border-radius:19px;padding:16px;margin-bottom:13px}
label{display:block;color:#c7cdd8;font-size:13px;margin:11px 0 6px}input,select{width:100%;padding:13px;border-radius:12px;border:1px solid #3c4555;background:#0f141c;color:white;font-size:17px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}
button{cursor:pointer}.primary{width:100%;padding:15px;border:0;border-radius:13px;background:#abc3ff;color:#10234d;font-weight:bold;font-size:17px;margin-top:14px}
.secondary{width:100%;padding:12px;border:1px solid #414b5b;border-radius:12px;background:transparent;color:#ddd;margin-top:8px}
.summary{background:#1454b8;border-radius:20px;padding:17px;margin-bottom:13px}.big{font-size:36px;font-weight:800;margin:3px 0 14px}.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}.box{background:#20325b;border-radius:12px;padding:10px}.box small{display:block;color:#bdc9df;margin-bottom:4px}.box b{font-size:15px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px 4px;border-bottom:1px solid #303746;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:center}
.scroll{overflow:auto}.client{display:flex;justify-content:space-between;align-items:center;padding:13px;background:#202631;border-radius:13px;margin:7px 0}.client b{display:block}.client small{color:#aab1be}.pill{padding:6px 9px;border-radius:10px;background:#283e66;color:#cfe0ff;font-size:12px}
.empty{color:#9299a7;text-align:center;padding:20px}.danger{color:#ffb4b4;border-color:#704040}
.note{color:#8f98a7;font-size:12px;line-height:1.45;margin-top:12px}
@media(max-width:390px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.nav button{font-size:11px}}
</style>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Prestamista">
</head>
<body>
<main>
<h1>💰 Mi Prestamista</h1>
<div class="sub">Calculadora y control de préstamos quincenales</div>

<div class="nav">
<button class="active" onclick="tab('calc',this)">🧮 Calcular</button>
<button onclick="tab('clients',this)">👥 Clientes</button>
<button onclick="tab('history',this)">📋 Historial</button>
</div>

<section id="calc" class="show">
<div class="card">
<div class="grid">
<div class="full"><label>Nombre del cliente</label><input id="name" placeholder="Ej. Juan Pérez"></div>
<div><label>Capital (C$)</label><input id="capital" type="number" inputmode="decimal" value="10000"></div>
<div><label>Interés por quincena (%)</label><input id="rate" type="number" inputmode="decimal" value="4" step=".1"></div>
<div><label>Número de quincenas</label><input id="terms" type="number" inputmode="numeric" value="10"></div>
<div><label>Fecha del primer pago</label><input id="date" type="date"></div>
</div>
<button class="primary" onclick="calculate()">CALCULAR PRÉSTAMO</button>
</div>

<div id="result"></div>

<div class="card">
<button class="primary" onclick="saveLoan()">💾 Guardar préstamo</button>
<div class="note">El préstamo guardado queda en este dispositivo. No se envía a ningún servidor.</div>
</div>
</section>

<section id="clients">
<div class="card">
<h2 style="margin-top:0">👥 Mis clientes</h2>
<div id="clientList"></div>
</div>
</section>

<section id="history">
<div class="card">
<h2 style="margin-top:0">📋 Préstamos guardados</h2>
<div id="historyList"></div>
<button class="secondary danger" onclick="clearAll()">Borrar todos los datos</button>
</div>
</section>
</main>

<script>
let loans=JSON.parse(localStorage.getItem('prestamos_v2')||'[]');
const money=n=>new Intl.NumberFormat('es-NI',{style:'currency',currency:'NIO',minimumFractionDigits:2}).format(n);
function todayPlus(days=0){let d=new Date();d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
document.getElementById('date').value=todayPlus(15);

function tab(id,btn){
 document.querySelectorAll('section').forEach(x=>x.classList.remove('show'));
 document.getElementById(id).classList.add('show');
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');
 if(id==='clients')renderClients(); if(id==='history')renderHistory();
}
function data(){
 return {name:document.getElementById('name').value.trim()||'Sin nombre',
 P:Math.max(0,+document.getElementById('capital').value||0),
 R:Math.max(0,+document.getElementById('rate').value||0)/100,
 N:Math.max(1,Math.floor(+document.getElementById('terms').value||1)),
 date:document.getElementById('date').value||todayPlus(15)}
}
function calculate(){
 const x=data(), interest=x.P*x.R, pp=x.P/x.N, pay=pp+interest, total=x.P+interest*x.N;
 let bal=x.P,rows='';
 for(let i=1;i<=x.N;i++){
   let cap=i===x.N?bal:pp;bal=Math.max(0,bal-cap);
   let dt=new Date(x.date+'T12:00:00');dt.setDate(dt.getDate()+((i-1)*14));
   rows+=`<tr><td>${i}</td><td>${dt.toLocaleDateString('es-NI')}</td><td>${money(cap)}</td><td>${money(interest)}</td><td>${money(cap+interest)}</td><td>${money(bal)}</td></tr>`;
 }
 document.getElementById('result').innerHTML=`
 <div class="summary"><small>CUOTA QUINCENAL</small><div class="big">${money(pay)}</div>
 <div class="mini"><div class="box"><small>Capital / quincena</small><b>${money(pp)}</b></div>
 <div class="box"><small>Interés / quincena</small><b>${money(interest)}</b></div>
 <div class="box"><small>Total intereses</small><b>${money(interest*x.N)}</b></div>
 <div class="box"><small>Total a pagar</small><b>${money(total)}</b></div></div></div>
 <div class="card"><b>📅 Calendario de pagos — ${x.name}</b><div class="scroll"><table><thead><tr><th>#</th><th>Fecha</th><th>Capital</th><th>Interés</th><th>Cuota</th><th>Saldo</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function saveLoan(){
 const x=data();x.id=Date.now();x.saved=new Date().toISOString();loans.push(x);localStorage.setItem('prestamos_v2',JSON.stringify(loans));alert('Préstamo guardado correctamente.');renderHistory();
}
function renderClients(){
 let names={};loans.forEach(l=>{names[l.name]=(names[l.name]||0)+1});
 const arr=Object.entries(names);
 document.getElementById('clientList').innerHTML=arr.length?arr.map(([n,c])=>`<div class="client"><div><b>${esc(n)}</b><small>${c} préstamo${c>1?'s':''}</small></div><span class="pill">${c}</span></div>`).join(''):'<div class="empty">Todavía no hay clientes guardados.</div>';
}
function renderHistory(){
 document.getElementById('historyList').innerHTML=loans.length?[...loans].reverse().map(l=>{
 const pay=l.P/l.N+l.P*l.R;
 return `<div class="client"><div><b>${esc(l.name)}</b><small>${money(l.P)} · ${l.R*100}% · ${l.N} quincenas</small></div><span class="pill">${money(pay)}</span></div>`;
 }).join(''):'<div class="empty">No hay préstamos guardados.</div>';
}
function clearAll(){if(confirm('¿Borrar todos los préstamos guardados?')){loans=[];localStorage.removeItem('prestamos_v2');renderHistory();renderClients()}}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
['capital','rate','terms','date'].forEach(id=>document.getElementById(id).addEventListener('input',calculate));
calculate();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
}
</script></body></html>
