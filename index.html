<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1454b8"><link rel="manifest" href="manifest.json"><title>Mi Prestamista 2.0</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#f5f7fb;font-family:Arial}main{max-width:620px;margin:auto;padding:15px}h1{margin:5px 0}.sub{color:#9da6b5;margin-bottom:14px}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.nav button{padding:10px 3px;border:0;border-radius:11px;background:#202633;color:#ddd;font-weight:bold}.nav .on{background:#abc3ff;color:#10234d}.tab{display:none}.tab.on{display:block}.card{background:#171c25;border:1px solid #303746;border-radius:18px;padding:15px;margin-top:12px}label{display:block;color:#c9ced8;font-size:13px;margin:10px 0 6px}input{width:100%;padding:13px;border-radius:11px;border:1px solid #414958;background:#0f141c;color:#fff;font-size:17px}.grid,.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{width:100%;padding:14px;border:0;border-radius:12px;margin-top:12px;background:#abc3ff;color:#10234d;font-weight:bold}.summary{background:#1454b8;border-radius:18px;padding:17px;margin-top:12px}.big{font-size:36px;font-weight:800;margin:4px 0 14px}.box{background:#20325b;border-radius:11px;padding:10px}.box small{display:block;color:#c4cee2}.box b{font-size:15px}.loan{background:#202631;border-radius:14px;padding:13px;margin:8px 0}.muted{color:#a5adbb;font-size:12px}.row{display:flex;justify-content:space-between;gap:8px}.pay{background:#abc3ff;color:#10234d}.del{background:#351b1f;color:#ffbdc2}.empty{text-align:center;color:#8f98a7;padding:20px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:7px 4px;border-bottom:1px solid #303746;text-align:right;white-space:nowrap}td:first-child,th:first-child{text-align:center}.tag{padding:5px 7px;border-radius:8px;background:#58421d;color:#ffe2a0;font-size:10px}.done{background:#284d35;color:#c9f4d1}.danger{border:1px solid #704047;background:transparent;color:#ffbfc4}
</style></head><body><main>
<h1>💰 Mi Prestamista 2.0</h1><div class="sub">Control completo de préstamos quincenales</div>
<div class="nav"><button class="on" onclick="tab('nuevo',this)">➕ Nuevo</button><button onclick="tab('activos',this)">📋 Activos</button><button onclick="tab('clientes',this)">👥 Clientes</button><button onclick="tab('resumen',this)">📊 Resumen</button></div>

<section id="nuevo" class="tab on"><div class="card">
<label>Cliente</label><input id="name" placeholder="Nombre del cliente">
<div class="grid"><div><label>Capital (C$)</label><input id="capital" type="number" value="10000"></div><div><label>Interés/quincena (%)</label><input id="rate" type="number" value="4" step=".1"></div><div><label>Quincenas</label><input id="terms" type="number" value="10"></div><div><label>Primer pago</label><input id="first" type="date"></div></div>
<button class="btn" onclick="preview()">🧮 CALCULAR</button></div><div id="preview"></div></section>
<section id="activos" class="tab"><div class="card"><h2>📋 Préstamos</h2><div id="loans"></div></div></section>
<section id="clientes" class="tab"><div class="card"><h2>👥 Clientes</h2><div id="people"></div></div></section>
<section id="resumen" class="tab"><div id="dash"></div></section>
</main>
<script>
let loans=JSON.parse(localStorage.getItem('mi_prestamista_2')||'[]'),current=null;
const money=n=>new Intl.NumberFormat('es-NI',{style:'currency',currency:'NIO'}).format(n);
const today=()=>new Date().toISOString().slice(0,10);
first.value=today();
function tab(id,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(id==='activos')renderLoans();if(id==='clientes')renderPeople();if(id==='resumen')renderDash()}
function get(){let P=+capital.value||0,R=(+rate.value||0)/100,N=Math.max(1,Math.floor(+terms.value||1));return{name:name.value.trim()||'Sin nombre',P,R,N,first:first.value||today(),ip:P*R,cp:P/N}}
function makeSchedule(x){let bal=x.P,a=[];for(let i=1;i<=x.N;i++){let d=new Date(x.first+'T12:00:00');d.setDate(d.getDate()+14*(i-1));let c=i===x.N?bal:x.cp;bal-=c;a.push({i,date:d.toISOString().slice(0,10),capital:c,interest:x.ip,amount:c+x.ip,balance:Math.max(0,bal),paid:false})}return a}
function preview(){let x=get(),s=makeSchedule(x),q=x.cp+x.ip;current={...x,schedule:s};preview.innerHTML=`<div class="summary"><small>CUOTA QUINCENAL</small><div class="big">${money(q)}</div><div class="grid"><div class="box"><small>Capital/pago</small><b>${money(x.cp)}</b></div><div class="box"><small>Interés/pago</small><b>${money(x.ip)}</b></div><div class="box"><small>Total intereses</small><b>${money(x.ip*x.N)}</b></div><div class="box"><small>Total a pagar</small><b>${money(x.P+x.ip*x.N)}</b></div></div></div><div class="card"><b>📅 Calendario</b><div class="scroll"><table><tr><th>#</th><th>Fecha</th><th>Cuota</th><th>Saldo</th></tr>${s.map(r=>`<tr><td>${r.i}</td><td>${r.date}</td><td>${money(r.amount)}</td><td>${money(r.balance)}</td></tr>`).join('')}</table></div></div><button class="btn" onclick="saveLoan()">💾 GUARDAR PRÉSTAMO</button>`}
function saveLoan(){if(!current)return;current.id=Date.now();loans.push(current);localStorage.setItem('mi_prestamista_2',JSON.stringify(loans));alert('Préstamo guardado correctamente.');renderLoans();tab('activos',document.querySelectorAll('.nav button')[1])}
function renderLoans(){if(!loans.length){loans.innerHTML='<div class="empty">No hay préstamos.</div>';return}document.getElementById('loans').innerHTML=loans.map((l,i)=>{let paid=l.schedule.filter(r=>r.paid).length,total=l.P+l.ip*l.N,col=l.schedule.filter(r=>r.paid).reduce((a,r)=>a+r.amount,0),next=l.schedule.find(r=>!r.paid);return`<div class="loan"><div class="row"><div><b>${esc(l.name)}</b><div class="muted">${money(l.P)} · ${l.R*100}% · ${l.N} quincenas</div></div><span class="tag ${paid===l.N?'done':''}">${paid===l.N?'COMPLETO':'ACTIVO'}</span></div><div class="muted" style="margin-top:7px">Pagos ${paid}/${l.N} · Cobrado ${money(col)} · Pendiente ${money(total-col)}</div>${next?`<button class="btn pay" onclick="pay(${i})">✅ Registrar pago #${next.i} · ${money(next.amount)}</button>`:''}<button class="btn del" onclick="removeLoan(${i})">Eliminar</button></div>`}).join('')}
function pay(i){let r=loans[i].schedule.find(x=>!x.paid);if(r){r.paid=true;r.paidDate=today();localStorage.setItem('mi_prestamista_2',JSON.stringify(loans));renderLoans();}}
function removeLoan(i){if(confirm('¿Eliminar este préstamo?')){loans.splice(i,1);localStorage.setItem('mi_prestamista_2',JSON.stringify(loans));renderLoans()}}
function renderPeople(){let m={};loans.forEach(l=>{m[l.name]=(m[l.name]||0)+1});people.innerHTML=Object.keys(m).length?Object.entries(m).map(([n,c])=>`<div class="loan"><b>${esc(n)}</b><div class="muted">${c} préstamo(s)</div></div>`).join(''):'<div class="empty">No hay clientes.</div>'}
function renderDash(){let cap=loans.reduce((a,l)=>a+l.P,0),expected=loans.reduce((a,l)=>a+l.P+l.ip*l.N,0),col=loans.reduce((a,l)=>a+l.schedule.filter(r=>r.paid).reduce((s,r)=>s+r.amount,0),0);dash.innerHTML=`<div class="card"><div class="stats"><div class="box"><small>Capital prestado</small><b>${money(cap)}</b></div><div class="box"><small>Total pactado</small><b>${money(expected)}</b></div><div class="box"><small>Total cobrado</small><b>${money(col)}</b></div><div class="box"><small>Por cobrar</small><b>${money(expected-col)}</b></div></div></div>`}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
preview();
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')</script></body></html>
